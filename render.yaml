services:
  - type: web
    name: stella-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://stella-backend.onrender.com

  - type: web
    name: stella-backend
    runtime: node
    rootDirectory: backend
    buildCommand: npm install
    startCommand: npx ts-node src/server.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: falses